services:
  postgres:
    image: postgres:16-alpine
    container_name: task-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-taskdb}
      POSTGRES_USER: ${DB_USERNAME:-taskuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_EXPOSED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-taskuser} -d ${DB_NAME:-taskdb}"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - task-platform-net

  mongo:
    image: mongo:7
    container_name: task-platform-mongo
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_EXPOSED_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - task-platform-net

  activity-log-service:
    build:
      context: ./backend/activity-log-service
      dockerfile: Dockerfile
    container_name: task-platform-activity-log
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx256m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=128m
        -XX:ReservedCodeCacheSize=64m
      MONGODB_URI: mongodb://mongo:27017/activity_log
    ports:
      - "${ACTIVITY_LOG_EXPOSED_PORT:-8081}:8081"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - task-platform-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task-platform-backend
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms128m
        -Xmx256m
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=128m
        -XX:ReservedCodeCacheSize=64m

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-taskdb}
      DB_USERNAME: ${DB_USERNAME:-taskuser}
      DB_PASSWORD: ${DB_PASSWORD:-taskpass}

      SERVER_PORT: 8080

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:${FRONTEND_EXPOSED_PORT:-80}}

      TASK_EXECUTOR_CORE_POOL_SIZE: ${TASK_EXECUTOR_CORE_POOL_SIZE:-4}
      TASK_EXECUTOR_MAX_POOL_SIZE: ${TASK_EXECUTOR_MAX_POOL_SIZE:-10}
      TASK_EXECUTOR_QUEUE_CAPACITY: ${TASK_EXECUTOR_QUEUE_CAPACITY:-50}
      TASK_EXECUTOR_KEEP_ALIVE_SECONDS: ${TASK_EXECUTOR_KEEP_ALIVE_SECONDS:-30}

      ACTIVITY_LOG_BASE_URL: http://activity-log-service:8081

    ports:
      - "${BACKEND_EXPOSED_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      activity-log-service:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - task-platform-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-platform-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_EXPOSED_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - task-platform-net

networks:
  task-platform-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data: