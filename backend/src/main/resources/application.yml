spring:
  application:
    name: task-execution-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskdb}
    username: ${DB_USERNAME:taskuser}
    password: ${DB_PASSWORD:taskpass}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80}

activity-log:
  base-url: ${ACTIVITY_LOG_BASE_URL:http://localhost:8081}

# Configurable Java thread pool backing all concurrent task execution.
task:
  executor:
    core-pool-size: ${TASK_EXECUTOR_CORE_POOL_SIZE:4}
    max-pool-size: ${TASK_EXECUTOR_MAX_POOL_SIZE:10}
    queue-capacity: ${TASK_EXECUTOR_QUEUE_CAPACITY:50}
    keep-alive-seconds: ${TASK_EXECUTOR_KEEP_ALIVE_SECONDS:30}
    thread-name-prefix: task-worker-

logging:
  level:
    root: INFO
    com.taskmanager: DEBUG
